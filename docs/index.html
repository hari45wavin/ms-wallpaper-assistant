<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微软壁纸助手 - kele551</title>
<style>
  :root{--bg:#f6f8fa;--card:#fff;--text:#1f2328;--muted:#59636e;--accent:#0969da;--border:#d1d9e0}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#151b23;--text:#f0f6fc;--muted:#9198a1;--accent:#4493f8;--border:#3d444d}}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:640px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;text-align:center}
  .icon{width:88px;height:88px;border-radius:20px;margin:0 auto 20px}
  h1{font-size:28px;margin-bottom:8px}
  .tagline{color:var(--muted);font-size:16px;line-height:1.7;margin-bottom:24px}
  ul{list-style:none;text-align:left;max-width:430px;margin:0 auto 28px;color:var(--muted);font-size:14.5px;line-height:2.1}
  .btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:12px 28px;border-radius:10px;font-size:15px;font-weight:600;margin:0 6px 10px}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  footer{margin-top:28px;color:var(--muted);font-size:13px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="icon.png" alt="微软壁纸助手">
  <h1>微软壁纸助手</h1>
  <p class="tagline">自动轮换 4K 桌面壁纸<br>必应每日一图 + Windows 聚焦 · 单文件便携</p>
  <ul>
    <li>必应每日一图自动更换</li>
    <li>支持 Windows 聚焦壁纸</li>
    <li>4K 原图画质</li>
    <li>免安装 · 免管理员 · 不写注册表</li>
  </ul>
  <a class="btn" href="https://github.com/kele551/ms-wallpaper-assistant/releases/latest">⬇ 下载最新版</a>
  <a class="btn ghost" href="https://github.com/kele551/ms-wallpaper-assistant">GitHub 仓库</a>
  <footer>MIT License · 由 <a href="https://github.com/kele551">kele551</a> 开源</footer>
</div>
</body>
</html>
